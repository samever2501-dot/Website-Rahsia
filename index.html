<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envelope 💌</title>   

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #ffe6eb;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Flowers */
.flower {
    position: absolute;
    width: 100px;
    height: 100px;
    animation: float 10s linear infinite;
    opacity: 0.6;
}

/* 🌸 TYPE 1 */
.flower1 {
    background: url("Flowers .png") no-repeat center/contain;
}

/* 🌸 TYPE 2 */
.flower2 {
    background: url("Flowers2 .png") no-repeat center/contain;
}

@keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); }
    100% { transform: translateY(-20vh) rotate(360deg); }
}

@keyframes float {
    0% { transform: translateY(100vh) rotate(-45deg); }
    100% { transform: translateY(-20vh) rotate(-45deg); }
}

/* INPUT */
.inputBox {
    text-align: center;
}

input {
    padding: 10px;
    border-radius: 20px;
    border: 2px solid #ff4d6d;
    text-align: center;
}

button {
    margin-top: 10px;
    padding: 8px 20px;
    border: none;
    background: #ff4d6d;
    color: white;
    border-radius: 20px;
    cursor: pointer;
}

/* ENVELOPE */
.envelope {
    position: relative;
    width: 260px;
    height: 170px;
    cursor: pointer;
}

/* BODY */
.base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff4d6d;
    border-radius: 6px;
}

/* LEFT FOLD */
.left {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff3355;
    clip-path: polygon(0 0, 50% 50%, 0 100%);
}

/* RIGHT FOLD */
.right {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff3355;
    clip-path: polygon(100% 0, 50% 50%, 100% 100%);
}

/* TOP FLAP */
.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff1f4b;
    clip-path: polygon(0 0, 100% 0, 50% 55%);
}

/* instruction (kalau belum ada style) */
#instruction {
    position: absolute;
    top: -40px;
    width: 100%;
    text-align: center;
    color: #ff4d6d;
    font-weight: bold;
}

/* SHAKE */
.shake1 { animation: s1 0.4s; }
@keyframes s1 {
    0% { transform: translateX(0); }
    50% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
}

.shake2 { animation: s2 0.4s; }
@keyframes s2 {
    0% { transform: translateX(0); }
    50% { transform: translateX(8px); }
    100% { transform: translateX(0); }
}

/* BURST */
.burst {
    animation: burst 0.6s ease forwards;
}

@keyframes burst {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(0); opacity: 0; }
}

/* LETTER */
.letter {
    display: none;
    width: 380px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* NAME */
#name {
    text-align: center;
    font-size: 22px;
    color: #ff4d6d;
    font-weight: bold;
}

/* TEXT */
#text {
    font-size: 14px;
    line-height: 1.8;
}

/* SPECIAL */
.like {
    font-size: 30px;
    font-weight: bold;
    color: pink;
    -webkit-text-stroke: 1px red;
    text-align: center;
    margin: 15px 0;
}
</style>
</head>

<body>

<!-- Flowers -->
<div class="flower flower1" style="left:5%"></div>
<div class="flower flower2" style="left:15%; animation-delay:1s;"></div>

<div class="flower flower1" style="left:25%; animation-delay:5s;"></div>
<div class="flower flower2" style="left:35%; animation-delay:3s;"></div>

<div class="flower flower1" style="left:45%; animation-delay:7s;"></div>
<div class="flower flower2" style="left:55%; animation-delay:4.5s;"></div>

<div class="flower flower1" style="left:65%; animation-delay:5.5s;"></div>
<div class="flower flower2" style="left:75%; animation-delay:1.5s;"></div>

<div class="flower flower1" style="left:85%; animation-delay:2.5s;"></div>
<div class="flower flower2" style="left:95%; animation-delay:8.5s;"></div>

<!-- INPUT -->
<div id="inputScreen" class="inputBox">
    <h2>Tulis Nama 💌</h2>
    <input id="nameInput" placeholder="Nama kamu...">
    <br>
    <button onclick="openEnvelope()">Submit</button>
</div>

<!-- ENVELOPE -->
<div id="envelope" class="envelope" style="display:none;" onclick="clickEnvelope()">

    <div id="instruction">Click 3x to open 💌</div>

    <div class="base"></div>
    <div class="left"></div>
    <div class="right"></div>
    <div class="flap"></div>

</div>

<!-- LETTER -->
<div class="letter" id="letter">
    <div id="name"></div>
    <div id="text"></div>

    <!-- YES / NO -->
    <div id="choiceBox" style="display:none; text-align:center; margin-top:15px;">
        <h3>Do you feel the same? 💌</h3>

        <button onclick="acceptLove()" 
        style="margin:5px; padding:10px 20px; background:#ff4d6d; color:white; border:none; border-radius:20px;">
            YES 💖
        </button>

        <button onclick="rejectLove()" 
        style="margin:5px; padding:10px 20px; background:#444; color:white; border:none; border-radius:20px;">
            NO 💔
        </button>
    </div>
</div>

<!-- MUSIC -->
<audio id="bgmusic" loop>
    <source src="Blue .mp3" type="audio/mpeg">
</audio>

<script>

let clickCount = 0;

function openEnvelope() {
    let name = document.getElementById("nameInput").value;
    if(name === "") return alert("Isi nama dulu 😅");

    document.getElementById("inputScreen").style.display = "none";
    document.getElementById("envelope").style.display = "block";

    window.userName = name;
}

function clickEnvelope() {
    let env = document.getElementById("envelope");

    clickCount++;

    if(clickCount === 1) {
        env.classList.add("shake1");
        setTimeout(() => env.classList.remove("shake1"), 400);
    }

    else if(clickCount === 2) {
        env.classList.add("shake2");
        setTimeout(() => env.classList.remove("shake2"), 400);
    }

    else if(clickCount === 3) {
        env.classList.add("burst");

        setTimeout(() => {
            env.style.display = "none";
            document.getElementById("letter").style.display = "block";
            document.getElementById("name").innerHTML = "Haii " + window.userName;

            let music = document.getElementById("bgmusic");
            music.volume = 0.4;
            music.play().catch(e => console.log("Autoplay blocked"));

            typeText(fullText);
        }, 600);
    }
}

/* FULL TEXT (TIDAK DIUBAH) */
let fullText = `
My heart has been whispering something to me this day, and i think it's finally time to tell youu...

i just can't stop thinking about how amazing you are,
You’re honestly an attractive and independent person. No matter how many times life knocks you down,
you always find a way to stand back up.
That strength, combined with how caring and loving you are, is something really special.
I also love your story about your Family and i like to hear it more with your sabahan slang...
but 
its more than just that,

There's something about you keeps me thinking
about you all  the time.

Hmmmm...
Hmmmm...
Uhmmmmm.....

Actually I LIKE YOU

For so many reasons
i like everything about you from your story, your imperfections and the way they 
make you so perfectly you.
I love your personality, your vibe, and 
how you just light up everything around you
Your style is effortless and your smile...
it just makes everything better.

I made this code just to show you how deeply i'm in love with you. 
Every line of it reflects how i feel about you..

But no pressure, okay
You don't have to feel the same way..
I just needed to get this off my chest for my own peace of mind
Take Care☺️☺️....
`;

function typeText(text) {
    let box = document.getElementById("text");
    box.innerHTML = "";

    let lines = text.split("\n").filter(l => l.trim() !== "");
    let i = 0;
    let likeShown = false;

    function showLine() {

        if(i >= lines.length) {
            document.getElementById("choiceBox").style.display = "block";
            return;
        }

        let line = lines[i];
        let div = document.createElement("div");
        box.appendChild(div);

            let j = 0;

        function typeChar() {

            // 💖 SLOW TYPING EFFECT
            let speed = 70; // semua ayat jadi lebih slow

            if(line.length > 60) {
                speed = 100; // ayat panjang lagi slow
            }

            if(j < line.length) {
                div.innerHTML += line.charAt(j);
                j++;
                setTimeout(typeChar, speed);
            } else {


                if(!likeShown && line.includes("Actually I LIKE YOU")) {

                    likeShown = true;

                    setTimeout(() => {
                        div.innerHTML = "";
                        div.className = "like";
                        div.innerHTML = " I LIKE YOU";

                        i++;
                        setTimeout(showLine, 1200);

                    }, 8000);

                    return;
                }

                i++;
                setTimeout(showLine, 900);
            }
        }

        typeChar();
    }

    showLine();
}

/* 💖 YES → WHATSAPP */
function acceptLove() {
    document.getElementById("choiceBox").style.display = "none";

    document.getElementById("text").innerHTML = `
        <h2 style="color:pink; -webkit-text-stroke:1px red; font-size:30px;">
            Opening WhatsApp 💖
        </h2>
        <p style="text-align:center;">Sending your response...</p>
    `;

    let phone = "60179063170";

    let message = encodeURIComponent(
        "Hi 💖 I just want to say YES... I feel the same way too 😊"
    );

    setTimeout(() => {
        window.open(`https://wa.me/${0179063170}?text=${message}`, "_blank");
    }, 1500);
}

/* 💔 NO */
function rejectLove() {
    document.getElementById("choiceBox").style.display = "none";

    document.getElementById("text").innerHTML = `
        <h2 style="color:gray;">She said NO 💔</h2>
        <p style="text-align:center;">I understand... I respect your feelings 🤍</p>
    `;
}

</script>
